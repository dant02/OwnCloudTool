name: Build

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OwnCloudTool.slnx

      - name: Publish Windows release
        run: dotnet publish App/App.csproj --configuration Release --runtime win-x64 --self-contained false --no-restore --output artifacts/win-x64

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v6
        with:
          name: owncloudtool-win-x64
          path: artifacts/win-x64/

      - name: Publish Linux release
        run: dotnet publish App/App.csproj --configuration Release --runtime linux-x64 --self-contained false --no-restore --output artifacts/linux-x64

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v6
        with:
          name: owncloudtool-linux-x64
          path: artifacts/linux-x64/

      - name: Publish Windows web release
        run: dotnet publish Web/Web.csproj --configuration Release --runtime win-x64 --self-contained false --no-restore --output artifacts/web-win-x64

      - name: Upload Windows web release artifact
        uses: actions/upload-artifact@v6
        with:
          name: owncloudtool-web-win-x64
          path: artifacts/web-win-x64/

      - name: Publish Linux web release
        run: dotnet publish Web/Web.csproj --configuration Release --runtime linux-x64 --self-contained false --no-restore --output artifacts/web-linux-x64

      - name: Upload Linux web release artifact
        uses: actions/upload-artifact@v6
        with:
          name: owncloudtool-web-linux-x64
          path: artifacts/web-linux-x64/
