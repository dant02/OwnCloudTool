<VirtualHost *:80>
    ServerName owncloudtool.example.internal

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5080/
    ProxyPassReverse / http://127.0.0.1:5080/

    ErrorLog ${APACHE_LOG_DIR}/owncloudtool-error.log
    CustomLog ${APACHE_LOG_DIR}/owncloudtool-access.log combined
</VirtualHost>
